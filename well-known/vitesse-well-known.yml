  - {host: docs.vitesse.dev, dns: NXDOMAIN}
  - host: fullspeedautomation.com
    dns: resolves (Webflow proxy)
    status: 0
    error: TLS handshake failure (tlsv1 alert internal error)
    note: >-
      Legacy pre-rebrand brand domain. Full Speed Automation renamed to Vitesse Automation
      after acquiring Niagara Tech; the old Webflow site no longer completes a TLS handshake
      on either the apex or www, so nothing is harvestable from it.

