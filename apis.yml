aid: vitesse
name: Vitesse
description: >-
  Vitesse is a universal physical-AI platform for industrial machines, founded by the team
  behind Tesla's "Model 3 automation hell" fix alongside leaders from SpaceX, Siemens, and Safran.
  It connects any machine - Siemens, Allen-Bradley, Fanuc, KUKA, ABB, and legacy PLCs - through 135
  native OT connectors, generates control logic from a natural-language description of a process
  (up to 15x faster than traditional PLC programming), and runs the full stack at the edge on
  purpose-built industrial controllers with no cloud required. The platform layers hardware, live
  data dashboards and SCADA views, interoperability, physical AI, and zero-trust OT/IT cybersecurity
  (NIS2 and NIST aligned) into one stack, with real-time browser-based monitoring across 800,000+
  machine hours. Vitesse exposes a marketing website and a login-gated product application; it does
  not currently publish a public developer API, OpenAPI specification, or developer documentation.
